spring.application.name=backend

# MongoDB (business data)
# Configuración local por defecto. Si se define SPRING_DATA_MONGODB_URI en las variables de entorno, se usará Atlas.
# Ejemplo de URI de Atlas: mongodb+srv://noelsandoval002_db_user:DiS4eBHTH2yneVUY@cluster0.wbski4f.mongodb.net/examensw1?retryWrites=true&w=majority&appName=Cluster0
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/examensw1}

# H2 (Camunda engine tables - in-memory)
spring.datasource.url=jdbc:h2:mem:camunda;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=false

# Camunda 7 engine
camunda.bpm.auto-deployment-enabled=false
camunda.bpm.history-level=full
camunda.bpm.job-execution.enabled=true
camunda.bpm.admin-user.id=admin
camunda.bpm.admin-user.password=admin
camunda.bpm.admin-user.first-name=Admin
# Requerido desde Camunda 7.19: desactiva el enforcement del TTL para evitar error ENGINE-12018
camunda.bpm.generic-properties.properties.enforceHistoryTimeToLive=false

# JWT
jwt.secret=clave-secreta-super-segura-examensw1-2024
jwt.expiration=86400000

# CORS
cors.allowed-origins=*

# Server
server.port=8080

 
# AWS S3 Settings
#aws.s3.access-key=${AWS_S3_ACCESS_KEY}
#aws.s3.secret-key=${AWS_S3_SECRET_KEY}
# En produccion usar variables de entorno. En local, coloca tus credenciales aqui o en un .env
aws.s3.access-key=${AWS_S3_ACCESS_KEY:TU_ACCESS_KEY_AQUI}
aws.s3.secret-key=${AWS_S3_SECRET_KEY:TU_SECRET_KEY_AQUI}
aws.s3.bucket=examensw1-documentos-2026
aws.s3.region=us-east-2

# application.properties
server.address=0.0.0.0
# src/main/resources/application.properties
onlyoffice.jwt.secret=rxCBhCC7gSHd6umXzbOcX4vzgzu9D6qM

# Jackson: serializar fechas como ISO-8601 strings (no como arrays de números)
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# File Upload Limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB


